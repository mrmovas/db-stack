services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DATABASE_USER?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_DB:?DATABASE_DB is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-net
      - shared-db-net
    profiles:
      - hosted  # only starts when using hosted mode (--profile hosted)

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks:
      - app-net
    profiles:
      - tools
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      target: production
    env_file:
      - .env
    volumes:
     - ./db-backups/scheduled:/app/db-backups/scheduled
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped
    networks:
      - app-net
      - shared-db-net

  cli:
    build:
      context: .
      dockerfile: Dockerfile.cli
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - ./db-backups/manual:/app/db-backups/manual
      - ./db-backups/pre-migration:/app/db-backups/pre-migration
      - ./db-backups/scheduled:/app/db-backups/scheduled:ro
      - ./migrations:/app/migrations
    networks:
      - app-net
      - shared-db-net
    profiles:
      - cli  # only starts when explicitly requested

volumes:
  postgres_data:

networks:
  app-net:
    driver: bridge
  shared-db-net:
    external: true
